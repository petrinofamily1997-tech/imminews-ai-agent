name: Financial Bot Auto-Run

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Скачать репозиторий
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Установить Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --------------------------------------------------
      # 3. Установить библиотеки
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq feedparser requests python-dotenv tweepy

      # --------------------------------------------------
      # 4. Запустить бота
      # --------------------------------------------------
      - name: Run Financial Bot
        env:
          # Groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          # Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # X / Twitter
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

          # Cloudflare AI
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

          # Pexels
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

        run: |
          python main.py

      # --------------------------------------------------
      # 5. Сохранить историю новостей
      # --------------------------------------------------
      - name: Commit and push history
        if: always()
        run: |
          git config --global user.name "Financial Bot"
          git config --global user.email "actions@github.com"

          git add history.txt

          git diff --cached --quiet || git commit -m "Update news history [skip ci]"

          git push
