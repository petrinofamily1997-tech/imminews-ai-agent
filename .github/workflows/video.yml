name: Financial Video Bot

"on":
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq requests python-dotenv

      - name: Check project files
        run: |
          echo "=============================="
          echo "PROJECT FILES"
          echo "=============================="

          ls -la

          echo ""
          echo "=============================="
          echo "MUSIC"
          echo "=============================="

          find assets/music \
            -maxdepth 1 \
            -type f \
            -name "*.mp3" \
            -print || true

          echo ""
          echo "=============================="
          echo "VIDEO BOT"
          echo "=============================="

          ls -lh video_bot.py

      - name: Run Video Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "llama-3.3-70b-versatile"

          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}

        run: |
          python video_bot.py

      - name: Check generated video
        if: success()
        run: |
          echo "=============================="
          echo "GENERATED VIDEO"
          echo "=============================="

          if [ -f "output/video.mp4" ]; then
            ls -lh output/video.mp4

            echo ""
            echo "Video information:"
            ffprobe \
              -v error \
              -show_entries format=duration,size \
              -show_entries stream=width,height,codec_name \
              -of default=noprint_wrappers=1 \
              output/video.mp4
          else
            echo "❌ output/video.mp4 was not created"
            exit 1
          fi

      - name: Upload video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: financial-video
          path: output/video.mp4
          if-no-files-found: error
          retention-days: 7
