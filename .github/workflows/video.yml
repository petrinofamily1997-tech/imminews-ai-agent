name: Video Bot

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-video:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --------------------------------------------------
      # 3. Python dependencies
      # --------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests python-dotenv groq
          fi

      # --------------------------------------------------
      # 4. FFmpeg
      # --------------------------------------------------
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # --------------------------------------------------
      # 5. Start YumCut
      #
      # IMPORTANT:
      # We DO NOT run npm install/build here.
      # YumCut is already packaged as a Docker image.
      # --------------------------------------------------
      - name: Start YumCut
        env:
          DATABASE_URL: "file:./dev.db"
          NEXTAUTH_SECRET: "github-actions-secret"
          NEXTAUTH_URL: "http://localhost:3000"
        run: |
          set -e

          echo "======================================"
          echo "STARTING YUMCUT"
          echo "======================================"

          docker pull igorshadurin/yumcut:latest

          docker rm -f yumcut 2>/dev/null || true

          docker run -d \
            --name yumcut \
            -p 3000:3000 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e NEXTAUTH_SECRET="$NEXTAUTH_SECRET" \
            -e NEXTAUTH_URL="$NEXTAUTH_URL" \
            igorshadurin/yumcut:latest

          echo ""
          echo "Waiting for YumCut..."

          READY=0

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null 2>&1; then
              READY=1
              echo "✅ YumCut is ready"
              break
            fi

            if ! docker ps --format '{{.Names}}' | grep -q '^yumcut$'; then
              echo "❌ YumCut container stopped unexpectedly"
              break
            fi

            echo "Waiting for YumCut... $i/60"
            sleep 2
          done

          echo ""
          echo "======================================"
          echo "CONTAINER STATUS"
          echo "======================================"

          docker ps -a

          echo ""
          echo "======================================"
          echo "YUMCUT LOGS"
          echo "======================================"

          docker logs yumcut || true

          if [ "$READY" -ne 1 ]; then
            echo ""
            echo "❌ YumCut did not become ready."
            exit 1
          fi

      # --------------------------------------------------
      # 6. Check YumCut HTTP
      # --------------------------------------------------
      - name: Check YumCut
        run: |
          set -e

          echo "Checking http://127.0.0.1:3000 ..."

          HTTP_CODE=$(curl \
            -s \
            -o /tmp/yumcut-response.txt \
            -w "%{http_code}" \
            http://127.0.0.1:3000/)

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 500 ]; then
            echo "❌ YumCut returned an invalid HTTP status"
            cat /tmp/yumcut-response.txt || true
            exit 1
          fi

          echo "✅ YumCut HTTP server is working"

      # --------------------------------------------------
      # 7. Run financial video bot
      # --------------------------------------------------
      - name: Run video bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YUMCUT_URL: "http://127.0.0.1:3000"
          YUMCUT_API_KEY: ${{ secrets.YUMCUT_API_KEY }}
        run: |
          set -e

          echo "======================================"
          echo "STARTING VIDEO BOT"
          echo "======================================"

          python video_bot.py

      # --------------------------------------------------
      # 8. Show YumCut logs on failure
      # --------------------------------------------------
      - name: YumCut logs on failure
        if: failure()
        run: |
          echo "======================================"
          echo "YUMCUT FAILURE LOGS"
          echo "======================================"

          docker ps -a || true

          docker logs yumcut 2>&1 || true

      # --------------------------------------------------
      # 9. Cleanup
      # --------------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          docker rm -f yumcut 2>/dev/null || true
