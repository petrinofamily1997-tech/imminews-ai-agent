name: Financial Video Bot

"on":
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq requests python-dotenv

      - name: Find old Groq model references
        run: |
          echo "Searching repository..."

          grep -Rni \
            --exclude-dir=.git \
            "llama-3.3-70b-versatile" \
            . || true

      - name: Replace deprecated Groq model
        run: |
          find . \
            -type f \
            -not -path "./.git/*" \
            -not -path "./.github/workflows/video.yml" \
            -exec sed -i \
            's/llama-3.3-70b-versatile/openai\/gpt-oss-120b/g' {} \;

          echo "Checking again..."

          grep -Rni \
            --exclude-dir=.git \
            "llama-3.3-70b-versatile" \
            . || true

      - name: Show Video Bot
        run: |
          echo "=============================="
          echo "VIDEO BOT LOCATION"
          echo "=============================="

          find . \
            -name "video_bot.py" \
            -print

          echo ""
          echo "=============================="
          echo "GROQ REFERENCES"
          echo "=============================="

          grep -n \
            "GROQ\|gpt-oss\|llama" \
            video_bot.py || true

      - name: Check music
        run: |
          echo "=============================="
          echo "MUSIC"
          echo "=============================="

          find . \
            -path "*/music/*.mp3" \
            -print || true

      - name: Run Video Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

        run: |
          echo "=============================="
          echo "STARTING VIDEO BOT"
          echo "=============================="

          python video_bot.py

      - name: Check output
        if: success()
        run: |
          echo "=============================="
          echo "GENERATED VIDEO"
          echo "=============================="

          if [ ! -f output/video.mp4 ]; then
            echo "❌ output/video.mp4 not found"
            exit 1
          fi

          ls -lh output/video.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=width,height,codec_name \
            -of default=noprint_wrappers=1 \
            output/video.mp4

      - name: Upload video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: financial-video
          path: output/video.mp4
          if-no-files-found: error
          retention-days: 7
