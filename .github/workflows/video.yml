name: Video Bot - Auto Create & Post

on:
  schedule:
    - cron: '0 */5 * * *'  # Каждые 5 часов
  workflow_dispatch:        # Ручной запуск

jobs:
  create-video:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # УСТАНОВКА PYTHON И ПАКЕТОВ
      # ============================================
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Дополнительная установка на всякий случай
          pip install chatterbox-tts torch torchaudio
      
      # ============================================
      # УСТАНОВКА NODE.JS И HYPERFRAMES
      # ============================================
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install HyperFrames
        run: npm install -g hyperframes
      
      # ============================================
      # УСТАНОВКА FFMPEG
      # ============================================
      
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ============================================
      # ЗАПУСК БОТА
      # ============================================
      
      - name: Run video bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python video_bot.py
