name: Financial Video Bot

"on":
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:
  create-video:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq requests python-dotenv

      - name: Check project
        run: |
          echo "=============================="
          echo "PROJECT"
          echo "=============================="

          ls -la

          echo ""
          echo "=============================="
          echo "MUSIC"
          echo "=============================="

          find assets/music \
            -maxdepth 1 \
            -type f \
            -name "*.mp3" \
            -print || true

          echo ""
          echo "=============================="
          echo "VIDEO BOT"
          echo "=============================="

          test -f video_bot.py
          echo "video_bot.py OK"

      - name: Run Video Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

        run: |
          python video_bot.py

      - name: Check generated video
        if: success()
        run: |

          echo "=============================="
          echo "VIDEO"
          echo "=============================="

          test -f output/video.mp4

          ls -lh output/video.mp4

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=width,height,codec_name \
            -of default=noprint_wrappers=1 \
            output/video.mp4

      - name: Upload video artifact
        if: success()
        uses: actions/upload-artifact@v4

        with:
          name: financial-video
          path: output/video.mp4
          if-no-files-found: error
          retention-days: 7
