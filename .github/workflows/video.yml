name: Financial Video Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq requests python-dotenv

      - name: Verify Telegram advertisement asset
        run: |
          test -f assets/photo.png
          file assets/photo.png

      - name: Run Video Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python video_bot.py

      - name: Check output
        if: success()
        run: |
          test -f output/video.mp4
          ls -lh output/video.mp4
          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=width,height,codec_name \
            -of default=noprint_wrappers=1 \
            output/video.mp4

      - name: Upload video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: financial-video
          path: output/video.mp4
          if-no-files-found: error
          retention-days: 7
