name: Video Bot

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ==========================================
      # Checkout
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip


      # ==========================================
      # Python dependencies
      # ==========================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================
      # FFmpeg
      # ==========================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ==========================================
      # Start YumCut
      # ==========================================

      - name: Start YumCut
        env:
          DATABASE_URL: "file:./dev.db"
          NEXTAUTH_SECRET: "github-actions-secret"
          NEXTAUTH_URL: "http://localhost:3000"

        run: |
          set -e

          echo "======================================"
          echo "STARTING YUMCUT"
          echo "======================================"

          docker pull igorshadurin/yumcut:latest

          docker rm -f yumcut 2>/dev/null || true

          docker run -d \
            --name yumcut \
            -p 3000:3000 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e NEXTAUTH_SECRET="$NEXTAUTH_SECRET" \
            -e NEXTAUTH_URL="$NEXTAUTH_URL" \
            igorshadurin/yumcut:latest

          echo ""
          echo "Waiting for YumCut..."

          READY=0

          for i in $(seq 1 60); do

            if curl -fsS http://127.0.0.1:3000/ > /dev/null 2>&1; then
              READY=1
              echo "✅ YumCut is ready"
              break
            fi

            if ! docker ps --format '{{.Names}}' | grep -q '^yumcut$'; then
              echo "❌ YumCut container stopped"
              break
            fi

            echo "Waiting... $i/60"
            sleep 2

          done


          echo ""
          echo "======================================"
          echo "DOCKER STATUS"
          echo "======================================"

          docker ps -a


          echo ""
          echo "======================================"
          echo "YUMCUT LOGS"
          echo "======================================"

          docker logs yumcut || true


          if [ "$READY" -ne 1 ]; then
            echo ""
            echo "❌ YumCut failed to start"
            exit 1
          fi


      # ==========================================
      # Check YumCut
      # ==========================================

      - name: Check YumCut
        run: |
          set -e

          echo "Checking YumCut..."

          HTTP_CODE=$(curl \
            -s \
            -o /tmp/yumcut-response.txt \
            -w "%{http_code}" \
            http://127.0.0.1:3000/)

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 500 ]; then
            echo "❌ YumCut returned HTTP $HTTP_CODE"
            cat /tmp/yumcut-response.txt || true
            exit 1
          fi

          echo "✅ YumCut is responding"


      # ==========================================
      # Run Video Bot
      # ==========================================

      - name: Run video bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YUMCUT_URL: "http://127.0.0.1:3000"
          YUMCUT_API_KEY: ${{ secrets.YUMCUT_API_KEY }}

        run: |
          set -e

          echo "======================================"
          echo "STARTING VIDEO BOT"
          echo "======================================"

          python video_bot.py


      # ==========================================
      # Debug YumCut if something failed
      # ==========================================

      - name: Show YumCut logs on failure
        if: failure()
        run: |
          echo "======================================"
          echo "YUMCUT FAILURE LOGS"
          echo "======================================"

          docker ps -a || true

          docker logs yumcut 2>&1 || true


      # ==========================================
      # Cleanup
      # ==========================================

      - name: Cleanup
        if: always()
        run: |
          docker rm -f yumcut 2>/dev/null || true
